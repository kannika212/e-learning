<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELD-101 การออกแบบและพัฒนา e-Learning</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Soft Pastel Pink & Berry Theme */
      --bg-main: #fff5f7;
      --bg-card: #ffffff;
      --bg-sidebar: #2d1425;
      --text-main: #331828;
      --text-muted: #6b4c5e;
      --text-sidebar: #fce7f3;
      --primary: #db2777;         /* Vibrant Rose Pink */
      --primary-hover: #be185d;
      --primary-light: #fce7f3;
      --accent: #9d174d;          /* Deep Berry Accent */
      --accent-light: #fdf2f8;
      --border-color: #fbcfe8;
      --focus-ring: #f472b6;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --error-bg: #ffe4e6;
      --error-text: #be123c;
      
      --font-heading: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
      --sidebar-width: 290px;
    }

    [data-theme="dark"] {
      /* Dark Berry Velvet Theme */
      --bg-main: #1c0a16;
      --bg-card: #2b1223;
      --bg-sidebar: #12050e;
      --text-main: #fce7f3;
      --text-muted: #f472b6;
      --text-sidebar: #fce7f3;
      --primary: #f472b6;
      --primary-hover: #f687b3;
      --primary-light: #481434;
      --accent: #fb7185;
      --accent-light: #380d24;
      --border-color: #501d3d;
      --focus-ring: #f472b6;
      --success-bg: #064e3b;
      --success-text: #86efac;
      --error-bg: #4c0519;
      --error-text: #fecdd3;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.7;
      color: var(--text-main);
      background-color: var(--bg-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    p, li {
      max-width: 68ch;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }

    a { color: var(--primary); }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .app-header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 10px rgba(219, 39, 119, 0.05);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .menu-toggle {
      background: var(--primary-light);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      cursor: pointer;
      color: var(--primary);
      display: none;
      font-weight: 600;
    }

    .course-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      font-family: var(--font-heading);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .theme-toggle-btn {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .progress-bar-container {
      background-color: var(--border-color);
      height: 6px;
      width: 100%;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .progress-bar-fill {
      background-color: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .app-container {
      display: flex;
      flex: 1;
      position: relative;
    }

    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      color: var(--text-sidebar);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease;
      z-index: 30;
      border-right: 1px solid var(--border-color);
    }

    .sidebar-content {
      padding: 1.25rem 1rem;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
    }

    .sidebar-user {
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(251, 207, 232, 0.2);
      border-radius: 12px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }

    .nav-list {
      list-style: none;
    }

    .nav-item {
      margin-bottom: 0.3rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      color: #fbcfe8;
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.92rem;
      transition: background-color 0.2s, color 0.2s;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .nav-link.active {
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(219, 39, 119, 0.3);
    }

    .check-icon {
      color: #f472b6;
      font-weight: bold;
    }

    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .reset-btn {
      width: 100%;
      padding: 0.55rem 0.75rem;
      background-color: transparent;
      border: 1px solid #f472b6;
      color: #fbcfe8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background-color: #be185d;
      color: #ffffff;
    }

    .reset-btn.confirming {
      background-color: #e11d48;
      color: #ffffff;
      border-color: #fda4af;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }

    .main-content {
      flex: 1;
      padding: 2rem 1.5rem;
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
    }

    .content-card {
      background-color: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 2.25rem;
      box-shadow: 0 4px 20px rgba(219, 39, 119, 0.05);
      margin-bottom: 1.5rem;
    }

    .section-tag {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 0.85rem;
    }

    .note-box {
      background-color: var(--accent-light);
      border-left: 4px solid var(--primary);
      padding: 1.1rem 1.3rem;
      border-radius: 0 12px 12px 0;
      margin: 1.25rem 0;
      font-size: 0.95rem;
    }

    .table-container {
      overflow-x: auto;
      margin: 1.25rem 0;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      text-align: left;
    }

    th, td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--primary-light);
      color: var(--primary);
      font-family: var(--font-heading);
    }

    ul, ol {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }

    li { margin-bottom: 0.4rem; }

    .citation {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 1rem;
      border-top: 1px dashed var(--border-color);
      padding-top: 0.6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.35rem;
      font-family: var(--font-heading);
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(219, 39, 119, 0.25);
    }

    .btn-primary:hover { 
      background-color: var(--primary-hover); 
      box-shadow: 0 6px 16px rgba(219, 39, 119, 0.35);
    }

    .btn-secondary {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover { background-color: var(--primary-light); color: var(--primary); }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
      gap: 1rem;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin: 1rem 0;
    }

    .option-btn {
      text-align: left;
      padding: 0.85rem 1.1rem;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: var(--primary-light);
      font-weight: 600;
      box-shadow: 0 0 0 1px var(--primary);
    }

    .feedback-box {
      padding: 1rem 1.25rem;
      border-radius: 12px;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .feedback-box.correct {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-text);
    }

    .feedback-box.incorrect {
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-text);
    }

    .input-text {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: var(--bg-card);
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .interactive-container {
      background-color: var(--accent-light);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.35rem;
      margin: 1.25rem 0;
    }

    .order-item {
      padding: 0.85rem 1.1rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.35rem;
      text-align: center;
      flex: 1;
      min-width: 140px;
      box-shadow: 0 2px 10px rgba(219, 39, 119, 0.05);
    }

    .stat-val {
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--primary);
      font-family: var(--font-heading);
    }

    .stat-grid {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.5rem 0;
    }

    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      .sidebar {
        position: fixed;
        top: 57px;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        box-shadow: 4px 0 15px rgba(0,0,0,0.2);
      }
      .sidebar.open { transform: translateX(0); }
      .main-content { padding: 1rem; }
      .content-card { padding: 1.35rem; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggleBtn" aria-label="เปิดหรือปิดเมนูสารบัญ">เมนูสารบัญ</button>
      <div class="course-title">ELD-101 การออกแบบและพัฒนา e-Learning</div>
    </div>
    <div class="header-right">
      <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="สลับธีม สว่าง/มืด">ธีมมืด</button>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </header>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-content">
        <div class="sidebar-user">
          <div style="font-size: 0.8rem; opacity: 0.8;">ผู้เรียน</div>
          <div id="sidebarUserNick" style="font-weight: 600; color: #ffffff;">ยังไม่ได้ระบุชื่อ</div>
        </div>
        <nav aria-label="สารบัญบทเรียน">
          <ul class="nav-list" id="navList">
            <!-- Nav items rendered dynamically -->
          </ul>
        </nav>
      </div>
      <div class="sidebar-footer">
        <button class="reset-btn" id="resetBtn">เริ่มใหม่ทั้งหมด</button>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <!-- Dynamic pages rendered here -->
    </main>
  </div>

  <script>
    const TOTAL_PAGES = 20;
    const STORAGE_KEY = 'eld101_learning_state_v3';

    const PAGES = [
      { id: 'welcome', title: 'หน้าแรก & วัตถุประสงค์', mod: 0 },
      { id: 'pretest', title: 'แบบทดสอบก่อนเรียน', mod: 0 },
      { id: 'm1_1', title: '1.1 นิยาม & ประเภท e-Learning', mod: 1 },
      { id: 'm1_2', title: '1.2 กรอบ ADDIE Model 5 ขั้น', mod: 1 },
      { id: 'm1_act', title: 'กิจกรรม: เรียงลำดับ ADDIE', mod: 1 },
      { id: 'm1_quiz', title: 'ตรวจความเข้าใจ บทที่ 1', mod: 1 },
      { id: 'm2_1', title: '2.1 วัตถุประสงค์ & Bloom Revised', mod: 2 },
      { id: 'm2_2', title: '2.2 เหตุการณ์การสอน 9 ขั้น Gagné', mod: 2 },
      { id: 'm2_act', title: 'กิจกรรม: จับคู่สถานการณ์ Gagné', mod: 2 },
      { id: 'm2_quiz', title: 'ตรวจความเข้าใจ บทที่ 2', mod: 2 },
      { id: 'm3_1', title: '3.1 หลัก Mayer & ปฏิสัมพันธ์ Moore', mod: 3 },
      { id: 'm3_2', title: '3.2 การเข้าถึงตามเกณฑ์ WCAG', mod: 3 },
      { id: 'm3_act', title: 'กิจกรรม: วินิจฉัยปัญหาสไลด์', mod: 3 },
      { id: 'm3_quiz', title: 'ตรวจความเข้าใจ บทที่ 3', mod: 3 },
      { id: 'm4_1', title: '4.1 การวัดผล & Normalized Gain', mod: 4 },
      { id: 'm4_2', title: '4.2 Kirkpatrick, SCORM/xAPI & จริยธรรม', mod: 4 },
      { id: 'm4_act', title: 'กิจกรรม: จับคู่ระดับ Kirkpatrick', mod: 4 },
      { id: 'm4_quiz', title: 'ตรวจความเข้าใจ บทที่ 4', mod: 4 },
      { id: 'posttest', title: 'แบบทดสอบหลังเรียน', mod: 5 },
      { id: 'summary', title: 'สรุปผลการเรียนรู้', mod: 5 }
    ];

    /* BALANCED QUIZ QUESTIONS (Balanced length, neutral style, no giveaway options) */
    const QUIZ_QUESTIONS = [
      {
        id: 1,
        question: "1. ขั้นตอนใดในกระบวนการ ADDIE ที่มีการจัดทำ Storyboard และกำหนดโครงสร้างบทเรียน?",
        options: [
          "การวิเคราะห์ (Analysis)", 
          "การออกแบบ (Design)", 
          "การพัฒนา (Development)", 
          "การประเมินผล (Evaluation)"
        ],
        answer: 1,
        explain: "ขั้น Design คือการวางแผนจัดทำ Storyboard กำหนดวัตถุประสงค์ และเลือกสื่อ ก่อนนำไปสร้างจริงในขั้น Development"
      },
      {
        id: 2,
        question: "2. ข้อใดคือลักษณะเด่นของการเรียนแบบ Asynchronous e-Learning?",
        options: [
          "ผู้เรียนและผู้สอนต้องเข้าทำกิจกรรมพร้อมกันแบบเรียลไทม์",
          "ผู้เรียนสามารถกำหนดเวลาและจังหวะการเรียนรู้ด้วยตนเอง",
          "ผู้เรียนจะต้องสื่อสารผ่านทางวิดีโอคอลสดเป็นหลักเท่านั้น",
          "ผู้เรียนไม่สามารถส่งข้อความสอบถามหรือซักถามผู้สอนได้"
        ],
        answer: 1,
        explain: "Asynchronous e-Learning ไม่จำกัดเวลาและสถานที่ ผู้เรียนควบคุมจังหวะการเรียน (Self-paced) ของตนเองได้"
      },
      {
        id: 3,
        question: "3. คำกริยา 'จำแนก เปรียบเทียบ วิเคราะห์องค์ประกอบ' จัดอยู่ในระดับใดของ Bloom's Taxonomy (Anderson & Krathwohl, 2001)?",
        options: [
          "ความเข้าใจ (Understand)", 
          "การประยุกต์ใช้ (Apply)", 
          "การวิเคราะห์ (Analyze)", 
          "การสร้างสรรค์ (Create)"
        ],
        answer: 2,
        explain: "การจำแนกและแยกแยะองค์ประกอบเชิงสัมพันธ์จัดอยู่ในขั้น 'การวิเคราะห์' (Analyze)"
      },
      {
        id: 4,
        question: "4. การที่ผู้สอนเริ่มบทเรียนด้วยการเปิดคลิปวิดีโอสถานการณ์ปัญหาสั้นๆ เพื่อกระตุ้นความสนใจ ตรงกับเหตุการณ์การสอนขั้นใดของ Gagné?",
        options: [
          "ขั้นที่ 1 เร้าความสนใจ (Gain Attention)",
          "ขั้นที่ 2 แจ้งวัตถุประสงค์ (Inform Objectives)",
          "ขั้นที่ 3 กระตุ้นความรู้เดิม (Stimulate Recall)",
          "ขั้นที่ 6 กระตุ้นการตอบสนอง (Elicit Performance)"
        ],
        answer: 0,
        explain: "ขั้นที่ 1 Gain Attention มุ่งเน้นการใช้สิ่งกระตุ้นเพื่อเรียกร้องความสนใจของผู้เรียนเข้าสู่บทเรียน"
      },
      {
        id: 5,
        question: "5. การตัดเสียงเพลงประกอบพื้นหลังที่ไม่จำเป็นออกจากสื่อสอน เพื่อป้องกันไม่ให้รบกวนการประมวลผลของผู้เรียน ตรงกับหลักมัลติมีเดียใดของ Mayer?",
        options: [
          "หลักความสอดคล้อง (Coherence Principle)",

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {
        console.warn("localStorage ไม่สามารถใช้งานได้:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("ไม่สามารถบันทึกลง localStorage ได้:", e);
      }
    }

    function setupTheme() {
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem('eld101_theme');
      } catch(e) {}

      if (!savedTheme) {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          savedTheme = 'dark';
        } else {
          savedTheme = 'light';
        }
      }
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeBtnText(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('eld101_theme', next);
      } catch(e) {}
      updateThemeBtnText(next);
    }

    function updateThemeBtnText(theme) {
      document.getElementById('themeToggleBtn').innerText = theme === 'dark' ? 'ธีมสว่าง' : 'ธีมมืด';
    }

    function getShuffledTestQuestions(type) {
      if (sessionTestQuestions[type]) return sessionTestQuestions[type];

      const prepared = QUIZ_QUESTIONS.map(q => {
        const originalOptions = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
        const shuffled = [...originalOptions];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return {
          ...q,
          shuffledOptions: shuffled
        };
      });

      sessionTestQuestions[type] = prepared;
      return prepared;
    }

    function navigateTo(pageId) {
      state.currentPage = pageId;

      saveState();

      updateProgressBar();

      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Close mobile drawer menu
      const sidebar = document.getElementById('sidebar');
      if (sidebar) sidebar.classList.remove('open');

      switch (pageId) {
        case 'welcome': renderWelcomePage(main); break;
        case 'pretest': renderTestPage(main, 'pre'); break;
        case 'm1_1': renderModule1_1(main); break;
        case 'm1_2': renderModule1_2(main); break;
        case 'm1_act': renderModule1_Act(main); break;
        case 'm1_quiz': renderModule1_Quiz(main); break;

        case 'm4_quiz': renderModule4_Quiz(main); break;

      let html = '';
      PAGES.forEach((p) => {
        const isDone = !!state.completedPages[p.id];
        const isActive = state.currentPage === p.id;

        html += `
          <li class="nav-item">
            <button class="nav-link ${isActive ? 'active' : ''}" onclick="navigateTo('${p.id}')">
              <span>${p.title}</span>
              ${isDone ? '<span class="check-icon" aria-label="เรียนแล้ว">✓</span>' : ''}
            </button>
          </li>
        `;
      });

      navList.innerHTML = html;
    }

      document.getElementById('progressBar').style.width = pct + '%';

    function renderTestPage(container, type) {
      const isPre = type === 'pre';
      const answersKey = isPre ? 'preAnswers' : 'postAnswers';
      const title = isPre ? 'แบบทดสอบก่อนเรียน (Pre-test)' : 'แบบทดสอบหลังเรียน (Post-test)';
      const questions = getShuffledTestQuestions(type);

      let html = `
        <div class="content-card">
          <span class="section-tag">${isPre ? 'วัดความรู้เดิม' : 'ประเมินผลสัมฤทธิ์'}</span>

          </p>

          </div>
          <form id="testForm">
      `;

      questions.forEach((q) => {
        const savedAns = state[answersKey][q.id];
        html += `
          <div style="margin-bottom: 1.75rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-color);">
            <div style="font-weight: 600; margin-bottom: 0.75rem;">${q.question}</div>
            <div class="option-group">
        `;

        q.shuffledOptions.forEach((optObj) => {
          const isChecked = savedAns === optObj.originalIdx ? 'checked' : '';
          html += `
            <label class="option-btn ${savedAns === optObj.originalIdx ? 'selected' : ''}">
              <input type="radio" name="q_${q.id}" value="${optObj.originalIdx}" ${isChecked} style="margin-right: 0.6rem; accent-color: var(--primary);">
              <span>${optObj.text}</span>
            </label>
          `;
        });

        html += `</div></div>`;
      });

      html += `
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
              ${isPre ? 'ส่งคำตอบและเริ่มบทที่ 1 →' : 'ส่งคำตอบและดูสรุปผลการเรียนรู้ →'}
            </button>
          </form>
        </div>
      `;

      container.innerHTML = html;

      const form = document.getElementById('testForm');
      form.addEventListener('change', (e) => {
        const name = e.target.name;
        if (name) {
          const labels = form.querySelectorAll(`input[name="${name}"]`);
          labels.forEach(input => {
            input.closest('.option-btn').classList.remove('selected');
          });
          if (e.target.checked) {
            e.target.closest('.option-btn').classList.add('selected');
          }
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let score = 0;
        let allAnswered = true;
        const warningBox = document.getElementById('testWarningBox');

        questions.forEach(q => {
          const selected = form.querySelector(`input[name="q_${q.id}"]:checked`);
          if (!selected) {
            allAnswered = false;
          } else {
            const val = parseInt(selected.value, 10);
            state[answersKey][q.id] = val;
            if (val === q.answer) score++;
          }
        });

        if (!allAnswered) {
          warningBox.style.display = 'block';
          window.scrollTo({ top: warningBox.offsetTop - 80, behavior: 'smooth' });
          return;
        }

        warningBox.style.display = 'none';
        if (isPre) {
          state.preScore = score;
          saveState();
          navigateTo('m1_1');
        } else {
          state.postScore = score;
          saveState();
          navigateTo('summary');
        }
      });
    }

        { key: 'D1', title: '2. Design (การออกแบบ)', desc: 'จัดทำ Storyboard และวางโครงสร้างบทเรียน' },
        { key: 'D2', title: '3. Development (การพัฒนา)', desc: 'สร้างสื่อ ผลิตวิดีโอ และประกอบบทเรียน' },
        { key: 'I', title: '4. Implementation (การนำไปใช้)', desc: 'เปิดให้ผู้เรียนเข้าเรียนในระบบ LMS' },
        { key: 'E', title: '5. Evaluation (การประเมินผล)', desc: 'ประเมินผลสัมฤทธิ์และปรับปรุงคอร์ส' }
      ];

      if (!window.m1State) {
        window.m1State = [...items].sort(() => Math.random() - 0.5);
      }

      const renderList = () => {
        const listDiv = document.getElementById('addieList');
        if (!listDiv) return;
        listDiv.innerHTML = window.m1State.map((it, idx) => `
          <div class="order-item">
            <div>
              <strong>${it.title}</strong><br>
              <span style="font-size: 0.85rem; color: var(--text-muted);">${it.desc}</span>
            </div>
            <div style="display: flex; gap: 0.25rem;">
              <button class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="moveAddie(${idx}, -1)">▲</button>
              <button class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="moveAddie(${idx}, 1)">▼</button>
            </div>
          </div>
        `).join('');
      };

      window.moveAddie = (idx, dir) => {
        const target = idx + dir;
        if (target < 0 || target >= window.m1State.length) return;
        const temp = window.m1State[idx];
        window.m1State[idx] = window.m1State[target];
        window.m1State[target] = temp;
        renderList();
      };

      container.innerHTML = `
        <div class="content-card">
          <span class="section-tag">กิจกรรมโต้ตอบ บทที่ 1</span>
          <h1>กิจกรรม: เรียงลำดับขั้นตอน ADDIE Model</h1>
          <p>กดปุ่ม ▲ และ ▼ เพื่อจัดเรียงลำดับขั้นตอนกระบวนการ ADDIE ให้ถูกต้องจากขั้นแรกไปขั้นสุดท้าย:</p>

            <div id="addieList"></div>
            <button class="btn btn-primary" id="checkAddieBtn" style="width: 100%; margin-top: 1rem;">ตรวจลำดับขั้นตอน</button>
            <div id="addieFeedback"></div>
          </div>

          <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="navigateTo('m1_2')">← ย้อนกลับ</button>
            <button class="btn btn-primary" onclick="navigateTo('m1_quiz')">หน้าถัดไป: ตรวจความเข้าใจ →</button>
          </div>
        </div>
      `;

      renderList();

      document.getElementById('checkAddieBtn').addEventListener('click', () => {
        const correctKeys = ['A', 'D1', 'D2', 'I', 'E'];
        const currentKeys = window.m1State.map(i => i.key);
        const isCorrect = JSON.stringify(correctKeys) === JSON.stringify(currentKeys);

        const fb = document.getElementById('addieFeedback');
        if (isCorrect) {
          fb.className = 'feedback-box correct';
          fb.innerHTML = 'เรียงลำดับขั้นตอน ADDIE ได้ถูกต้องครบถ้วน!';
        } else {
          fb.className = 'feedback-box incorrect';
          fb.innerHTML = 'ลำดับยังไม่ถูกต้อง ลองพิจารณา: Analysis → Design → Development → Implementation → Evaluation';
        }
      });
    }

    function renderModule3_1(container) {

          <h1>3.1 หลักมัลติมีเดีย Mayer & ปฏิสัมพันธ์ Moore</h1>
          
          <h2 style="font-size: 1.2rem; margin-top: 1.25rem;">หลักการเรียนรู้มัลติมีเดียของ Mayer (Mayer, 2009)</h2>
          <ul>
            <li><strong>Coherence Principle (ความสอดคล้อง):</strong> ตัดข้อความ ภาพ หรือเสียงที่ไม่เกี่ยวข้องออกเพื่อลดภาระทางสมอง</li>
            <li><strong>Signaling Principle (การเน้นย้ำ):</strong> ใส่สัญลักษณ์ เน้นสี หรือเน้นตัวหนาเพื่อชี้นำจุดสำคัญ</li>
            <li><strong>Segmenting Principle (การแบ่งย่อย):</strong> แบ่งเนื้อหาออกเป็นส่วนย่อยๆ ให้ผู้เรียนย่อยได้ตามจังหวะตนเอง</li>
            <li><strong>Spatial Contiguity (ความใกล้ชิดของพื้นที่):</strong> วางคำอธิบายไว้ใกล้กับภาพที่เกี่ยวข้อง</li>
            <li><strong>Redundancy Principle (การลดความซ้ำซ้อน):</strong> ใช้ภาพคู่กับเสียงบรรยาย ดีกว่าการใส่ภาพ เสียงบรรยาย และตัวอักษรยาวซ้ำกัน</li>
          </ul>

          <h2 style="font-size: 1.2rem; margin-top: 1.5rem;">ปฏิสัมพันธ์ 3 ประเภทของ Moore (Moore, 1989)</h2>

    function renderSummaryPage(container) {
      const pre = state.preScore !== null ? state.preScore : 0;
      const post = state.postScore !== null ? state.postScore : 0;
      const max = 8;

      let gain = 0;
      let gainText = '';

      if (pre === max) {
        if (post === max) {
          gain = 1.0;
          gainText = 'ได้คะแนนเต็มทั้งก่อนเรียนและหลังเรียน (รักษามาตรฐานความรู้ได้อย่างสมบูรณ์)';

          gainText = 'คะแนนก่อนเรียนเต็ม แต่คะแนนหลังเรียนลดลงเล็กน้อย';
        }
      } else {
        gain = (post - pre) / (max - pre);
        if (gain < 0) {
          gainText = 'คะแนนหลังเรียนน้อยกว่าก่อนเรียน (แนะนำให้ทบทวนบทเรียนซ้ำในจุดที่ไม่เข้าใจ)';
        } else if (gain >= 0.70) {
          gainText = 'พัฒนาการระดับสูง (High Gain : g ≥ 0.70)';
        } else if (gain >= 0.30) {
          gainText = 'พัฒนาการระดับปานกลาง (Medium Gain : 0.30 ≤ g < 0.70)';
        } else {
          gainText = 'พัฒนาการระดับต่ำ (Low Gain : g < 0.30)';
        }
      }

      const completedCount = Object.keys(state.completedPages).length;

      container.innerHTML = `
        <div class="content-card">
          <span class="section-tag">สรุปผลการเรียนรู้</span>
          <h1>รายงานสรุปผลการเรียนรู้ e-Learning</h1>
          <p>ยินดีด้วยคุณ <strong>${state.nickname || 'ผู้เรียน'}</strong> คุณได้เรียนจบหลักสูตรเรียบร้อยแล้ว!</p>

          <div class="stat-grid">
            <div class="stat-card">
              <div style="font-size: 0.85rem; color: var(--text-muted);">คะแนนก่อนเรียน</div>
              <div class="stat-val">${pre} / ${max}</div>
            </div>
            <div class="stat-card">
              <div style="font-size: 0.85rem; color: var(--text-muted);">คะแนนหลังเรียน</div>
              <div class="stat-val">${post} / ${max}</div>
            </div>
            <div class="stat-card">
              <div style="font-size: 0.85rem; color: var(--text-muted);">Normalized Gain (g)</div>
              <div class="stat-val" style="color: var(--primary);">${gain.toFixed(2)}</div>
            </div>
          </div>

          <div class="note-box">
            <strong>ผลการประเมินพัฒนาการ:</strong> ${gainText}<br>
            <strong>ความก้าวหน้าบทเรียน:</strong> เรียนครบแล้ว ${completedCount} จาก ${TOTAL_PAGES} หน้ากิจกรรม
          </div>

          <h2 style="font-size: 1.1rem; margin-top: 1.5rem;">ข้อจำกัดและการตีความผล:</h2>
          <p style="font-size: 0.9rem; color: var(--text-muted);">
            แบบทดสอบนี้เป็นแบบทดสอบสั้นจำนวน 8 ข้อ ผลคะแนนและค่า Normalized Gain รายบุคคลที่ได้ ใช้เป็นแนวทางในการสะท้อนการเรียนรู้เบื้องต้นเท่านั้น ไม่ควรนำไปใช้ตัดสินสมรรถนะความรู้ในเชิงสรุปผลรวมอย่างเป็นทางการ
          </p>

          <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="window.print()">พิมพ์ / บันทึกผลการเรียน (PDF)</button>
            <button class="btn btn-secondary" onclick="navigateTo('welcome')">กลับหน้าแรก</button>
          </div>
        </div>
      `;
    }

    function setupEventListeners() {
      // Menu toggle
      const menuBtn = document.getElementById('menuToggleBtn');
      const sidebar = document.getElementById('sidebar');
      if (menuBtn && sidebar) {
        menuBtn.addEventListener('click', () => {
          sidebar.classList.toggle('open');
        });
      }

      // Theme toggle
      const themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', toggleTheme);
      }

      // Reset button with 2-click confirmation
      const resetBtn = document.getElementById('resetBtn');
      let resetTimer = null;
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          if (!state.resetConfirmState) {
            state.resetConfirmState = true;
            resetBtn.innerText = 'ยืนยันล้างข้อมูล?';
            resetBtn.classList.add('confirming');
            
            resetTimer = setTimeout(() => {
              state.resetConfirmState = false;
              resetBtn.innerText = 'เริ่มใหม่ทั้งหมด';
              resetBtn.classList.remove('confirming');
            }, 4000);
          } else {
            clearTimeout(resetTimer);
            try {
              localStorage.removeItem(STORAGE_KEY);
            } catch(e) {}
            state = {
              nickname: '',
              currentPage: 'welcome',
              completedPages: {},
              preAnswers: {},
              postAnswers: {},
              preScore: null,
              postScore: null,
              resetConfirmState: false
            };
            sessionTestQuestions = { pre: null, post: null };
            resetBtn.innerText = 'เริ่มใหม่ทั้งหมด';
            resetBtn.classList.remove('confirming');
            navigateTo('welcome');
          }
        });
      }
    }

    function initApp() {
      loadState();
      setupTheme();
      setupEventListeners();
      renderNav();
      navigateTo(state.currentPage || 'welcome');
    }

    window.onload = function() {
      initApp();
    };
  </script>
</body>
</html>
